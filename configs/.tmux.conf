# TERM advertised to programs running inside tmux.
set -g default-terminal "screen-256color"

# Patch truecolor (24-bit RGB) into xterm-256color. Stock terminfo doesn't declare
# it, so without this tmux downgrades 24-bit colors from the outer terminal.
set -as terminal-overrides ',xterm-256color:Tc'

# Advertise OSC 52 clipboard-write support so `set-clipboard on` actually emits
# the escape (ESC ] 52 ; c ; <base64> BEL) to the outer terminal. Needed for
# yank-from-tmux to land in the system clipboard. Separate entries cover
# terminals whose TERM doesn't match xterm* (alacritty, wezterm).
set -as terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\7'
set -as terminal-overrides ',alacritty:Ms=\E]52;c;%p2%s\7'
set -as terminal-overrides ',wezterm:Ms=\E]52;c;%p2%s\7'

# Declare italic support (sitm = "set italic mode"). xterm-256color's terminfo
# lacks this, so italics get stripped by tmux without the override. alacritty
# and wezterm declare sitm natively, so xterm* is enough.
set -as terminal-overrides ',xterm*:sitm=\E[3m'

setw -g xterm-keys on

set -g status-style "fg=default bg=default"
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g base-index 1 # start indexing windows at 1 instead of 0
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

set -g status-position top # status bar at the top

# Enable mouse support
set -g mouse on

# Enable clipboard
set -s set-clipboard on

# Pane splitting
unbind %
bind | split-window -h -c "#{pane_current_path}" # Split pane horizontally with |

unbind '"'
bind - split-window -v -c "#{pane_current_path}" # Split pane vertically with -

# Set new windows to open in current directory
bind c new-window -c "#{pane_current_path}"

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf  # Reload tmux configuration with 'r'

# Resize panes
bind -r j resize-pane -D 5  # Resize pane down
bind -r k resize-pane -U 5  # Resize pane up
bind -r l resize-pane -R 5  # Resize pane right
bind -r h resize-pane -L 5  # Resize pane left

# Toggle pane zoom
bind -r m resize-pane -Z  # Toggle pane zoom (maximize/restore)

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# Pinning catppuccin to v0.2.0 because later versions are a bitch to setup.
# Spent the entire fucking day trying to get it to recreate the same visual look as this version.
set -g @plugin 'catppuccin/tmux#v0.2.0'

set -g @catppuccin_status_background "default"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

set -g @catppuccin_status_modules_right "date_time"
set -g @catppuccin_status_modules_left "session"
# set -g @catppuccin_date_time_text "%B %d, %Y %I:%M:%S %p"
set -g @catppuccin_date_time_text "%b %d, %Y %I:%M %p"
# set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_directory_text "#{=21:pane_current_path}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents

set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @continuum-restore 'on' # enable tmux-continuum functionality

set -g @plugin 'tmux-plugins/tmux-yank' # Copy to the system clipboard in tmux

set -g @plugin 'fcsonline/tmux-thumbs'

## Session Manager
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme 'gold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
